<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join the Drift beta</title>
<meta name="description" content="Drift is in private beta. Join the list and we'll send an invite as slots open up.">
<link rel="stylesheet" href="join.css">
</head>
<body>

<main class="wrap">
  <p class="kicker">Private beta</p>

  <h1>Your issues go stale.<br><span class="ghost">Drift doesn't.</span></h1>

  <p class="sub">
    Drift listens to your meetings, remembers every decision, and updates the
    issues that decision touched. We're letting teams in a few at a time.
  </p>

  <form class="join" action="/api/beta" method="post">
    <label class="sr-only" for="email">Work email</label>
    <input
      id="email"
      name="email"
      type="email"
      placeholder="you@company.com"
      autocomplete="email"
      required>
    <button class="btn-join" type="submit">Join the beta</button>
  </form>

  <p class="fineprint">No newsletter, no drip campaign. One email when your slot opens.</p>
</main>

</body>
</html>
